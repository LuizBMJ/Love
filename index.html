<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Fogos de Artifício - I LOVE YOU</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #03030b;
        height: 100%;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const canvas = document.getElementById('c')
      const ctx = canvas.getContext('2d')
      function resize() {
        canvas.width = innerWidth
        canvas.height = innerHeight
      }
      resize()
      window.addEventListener('resize', resize)

      function rand(min, max) {
        return Math.random() * (max - min) + min
      }
      function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms))
      }
      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1))
          ;[arr[i], arr[j]] = [arr[j], arr[i]]
        }
        return arr
      }
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3)
      }

      /* ---------------- Fundo com estrelas sutis ---------------- */
      let stars = []
      function initStars() {
        stars = []
        const count = Math.floor((canvas.width * canvas.height) / 9000)
        for (let i = 0; i < count; i++) {
          stars.push({
            x: rand(0, canvas.width),
            y: rand(0, canvas.height * 0.75),
            r: rand(0.4, 1.3),
            phase: rand(0, Math.PI * 2),
            speed: rand(0.6, 1.6),
          })
        }
      }
      initStars()
      window.addEventListener('resize', initStars)
      function drawStars(now) {
        for (const s of stars) {
          const a =
            0.25 +
            0.35 * (0.5 + 0.5 * Math.sin(now * 0.0009 * s.speed + s.phase))
          ctx.globalAlpha = a
          ctx.fillStyle = '#cfd6ff'
          ctx.beginPath()
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2)
          ctx.fill()
        }
        ctx.globalAlpha = 1
      }

      /* ---------------- Fogos de fundo (ambientes) ---------------- */
      let sparks = []
      class Rocket {
        constructor() {
          this.x = rand(canvas.width * 0.12, canvas.width * 0.88)
          this.y = canvas.height + rand(0, 20)
          this.baseX = this.x
          this.wobbleAmp = rand(4, 14)
          this.wobbleFreq = rand(0.008, 0.02)
          this.targetY = rand(canvas.height * 0.12, canvas.height * 0.55)
          this.vy = rand(-9.5, -6.8)
          this.hue = rand(0, 360)
          this.color = `hsl(${this.hue},100%,${rand(60, 72)}%)`
          this.age = 0
          this.done = false
        }
        update() {
          this.age++
          this.y += this.vy
          this.vy += 0.048
          this.x =
            this.baseX + Math.sin(this.age * this.wobbleFreq) * this.wobbleAmp
          if (Math.random() < 0.55) {
            sparks.push({
              x: this.x,
              y: this.y,
              vx: rand(-0.3, 0.3),
              vy: rand(0.2, 0.8),
              alpha: rand(0.4, 0.7),
              color: `hsl(${this.hue},90%,75%)`,
              size: rand(0.6, 1.3),
              grav: 0.01,
              decay: rand(0.03, 0.05),
            })
          }
          if (this.y <= this.targetY || this.vy >= -0.4) {
            this.explode()
            this.done = true
          }
        }
        draw() {
          ctx.beginPath()
          ctx.fillStyle = this.color
          ctx.arc(this.x, this.y, 2, 0, Math.PI * 2)
          ctx.fill()
        }
        explode() {
          const count = rand(45, 85)
          const hue = this.hue + rand(-15, 15)
          const shapeBias = Math.random()
          for (let i = 0; i < count; i++) {
            const angle = rand(0, Math.PI * 2)
            const speed = shapeBias < 0.15 ? rand(3, 7) : rand(1, 6)
            const isGlimmer = Math.random() < 0.3
            sparks.push({
              x: this.x,
              y: this.y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              alpha: 1,
              color: `hsl(${hue + rand(-18, 18)},${rand(80, 100)}%,${rand(52, 78)}%)`,
              size: isGlimmer ? rand(0.8, 1.4) : rand(1.4, 2.8),
              grav: rand(0.03, 0.055),
              decay: isGlimmer ? rand(0.02, 0.032) : rand(0.01, 0.017),
            })
          }
        }
      }
      let rockets = []
      setInterval(
        () => {
          if (Math.random() < 0.8) rockets.push(new Rocket())
        },
        rand(750, 1050),
      )

      function updateSparks() {
        for (let i = sparks.length - 1; i >= 0; i--) {
          const p = sparks[i]
          p.vy += p.grav
          p.vx *= 0.986
          p.vy *= 0.986
          p.x += p.vx
          p.y += p.vy
          p.alpha -= p.decay
          if (p.alpha <= 0) sparks.splice(i, 1)
        }
      }
      function drawSparks() {
        for (const p of sparks) {
          ctx.globalAlpha = Math.max(p.alpha, 0)
          ctx.fillStyle = p.color
          ctx.shadowBlur = 9
          ctx.shadowColor = p.color
          ctx.beginPath()
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2)
          ctx.fill()
        }
        ctx.shadowBlur = 0
        ctx.globalAlpha = 1
      }

      /* ---------------- Formação de texto / coração ---------------- */
      let formation = []
      let formationVisible = false

      function getTextPoints(text) {
        const off = document.createElement('canvas')
        off.width = canvas.width
        off.height = canvas.height
        const octx = off.getContext('2d')
        let fontSize = Math.min(
          canvas.width / (text.length * 0.6),
          canvas.height * 0.22,
        )
        fontSize = Math.max(fontSize, 40)
        octx.fillStyle = '#fff'
        octx.font = `bold ${fontSize}px 'Arial Black', Arial, sans-serif`
        octx.textAlign = 'center'
        octx.textBaseline = 'middle'
        octx.fillText(text, off.width / 2, off.height / 2)
        const img = octx.getImageData(0, 0, off.width, off.height).data
        const pts = []
        const step = Math.max(3, Math.floor(fontSize / 22))
        for (let y = 0; y < off.height; y += step) {
          const rowJitter = rand(-1, 1)
          for (let x = 0; x < off.width; x += step) {
            const idx = (y * off.width + x) * 4
            if (img[idx + 3] > 128) {
              pts.push({
                x: x + rand(-1.2, 1.2) + rowJitter * 0.3,
                y: y + rand(-1.2, 1.2),
              })
            }
          }
        }
        return pts
      }

      function isInsideHeart(x, y) {
        const v = x * x + y * y - 1
        return v * v * v - x * x * y * y * y <= 0
      }
      function getHeartPoints(count, cx, cy, scale) {
        const pts = []
        let attempts = 0
        while (pts.length < count && attempts < count * 40) {
          attempts++
          const x = rand(-1.3, 1.3),
            y = rand(-1.2, 1.4)
          if (isInsideHeart(x, y)) {
            pts.push({
              x: cx + x * scale + rand(-1.5, 1.5),
              y: cy - y * scale + rand(-1.5, 1.5),
            })
          }
        }
        return pts
      }

      function spawnFormation(targetPoints, colorFn) {
        const origins = []
        for (let i = 0; i < 5; i++) {
          origins.push({
            x: rand(canvas.width * 0.25, canvas.width * 0.75),
            y: rand(canvas.height * 0.28, canvas.height * 0.58),
          })
        }
        const shuffled = shuffle(targetPoints.slice())
        const now = performance.now()
        formation = shuffled.map((pt, i) => {
          const o = origins[i % origins.length]
          const angle = rand(0, Math.PI * 2),
            speed = rand(2, 7.5)
          return {
            x: o.x,
            y: o.y,
            tx: pt.x,
            ty: pt.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            spawnTime: now,
            delay: rand(0, 260),
            burstDuration: rand(420, 620),
            lerpSpeed: rand(0.045, 0.095),
            holding: false,
            arrivedAt: 0,
            color: colorFn(),
            baseSize: rand(1.3, 2.7),
            size: rand(1.3, 2.7),
            phase: rand(0, Math.PI * 2),
            wobbleSpeed: rand(0.003, 0.006),
            wobbleRadius: rand(0.8, 2.1),
            twinkleSpeed: rand(0.004, 0.009),
          }
        })
        formationVisible = true
      }

      function retargetFormation(targetPoints) {
        const shuffled = shuffle(targetPoints.slice())
        const now = performance.now()
        for (let i = 0; i < formation.length; i++) {
          const pt = shuffled[i % shuffled.length]
          const p = formation[i]
          p.tx = pt.x
          p.ty = pt.y
          p.holding = false
          p.delay = rand(0, 200)
          p.spawnTime = now - (p.burstDuration + 10)
          p.lerpSpeed = rand(0.04, 0.085)
        }
      }

      function clearFormation() {
        formation = []
        formationVisible = false
      }

      function updateDrawFormation(now) {
        if (!formationVisible) return
        for (const p of formation) {
          const age = now - p.spawnTime - p.delay
          if (age < 0) {
            // ainda não iniciou (leve atraso entre partículas para efeito orgânico)
          } else if (age < p.burstDuration && !p.holding) {
            p.vy += 0.028
            p.vx *= 0.99
            p.vy *= 0.99
            p.x += p.vx
            p.y += p.vy
          } else if (!p.holding) {
            p.x += (p.tx - p.x) * p.lerpSpeed
            p.y += (p.ty - p.y) * p.lerpSpeed
            if (Math.abs(p.tx - p.x) < 1.2 && Math.abs(p.ty - p.y) < 1.2) {
              p.holding = true
              p.arrivedAt = now
            }
          } else {
            const settle = Math.min(1, (now - p.arrivedAt) / 400)
            const radius = p.wobbleRadius * settle
            p.x = p.tx + Math.sin(now * p.wobbleSpeed + p.phase) * radius
            p.y = p.ty + Math.cos(now * p.wobbleSpeed * 0.8 + p.phase) * radius
          }
          const twinkle = p.holding
            ? 0.5 + 0.5 * Math.sin(now * p.twinkleSpeed + p.phase * 3)
            : Math.min(1, Math.max(0, age / 150))
          if (age < 0) continue
          ctx.globalAlpha = 0.35 + twinkle * 0.65
          ctx.fillStyle = p.color
          ctx.shadowBlur = 10
          ctx.shadowColor = p.color
          ctx.beginPath()
          ctx.arc(p.x, p.y, p.baseSize, 0, Math.PI * 2)
          ctx.fill()
        }
        ctx.shadowBlur = 0
        ctx.globalAlpha = 1
      }

      /* ---------------- Loop principal ---------------- */
      function loop() {
        const now = performance.now()
        ctx.fillStyle = 'rgba(3,3,11,0.22)'
        ctx.fillRect(0, 0, canvas.width, canvas.height)

        drawStars(now)

        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i]
          if (!r.done) {
            r.update()
            r.draw()
          } else rockets.splice(i, 1)
        }
        updateSparks()
        drawSparks()
        updateDrawFormation(now)

        requestAnimationFrame(loop)
      }
      loop()

      /* ---------------- Sequência (fogos -> texto 5s -> coração) ---------------- */
      function goldColor() {
        return `hsl(${rand(40, 53)},${rand(85, 100)}%,${rand(58, 80)}%)`
      }
      function heartColor() {
        return `hsl(${rand(338, 356)},${rand(80, 95)}%,${rand(55, 72)}%)`
      }

      async function runCycle() {
        while (true) {
          clearFormation()
          await sleep(rand(4200, 4900))

          const textPts = getTextPoints('I LOVE YOU')
          spawnFormation(textPts, goldColor)
          await sleep(1500)
          await sleep(5000) // segura "I LOVE YOU" por 5 segundos

          const heartPts = getHeartPoints(
            textPts.length,
            canvas.width / 2,
            canvas.height / 2,
            Math.min(canvas.width, canvas.height) * 0.32,
          )
          retargetFormation(heartPts)
          for (const p of formation) p.color = heartColor()
          await sleep(1500)
          await sleep(4500) // segura o coração

          clearFormation()
          await sleep(1000)
        }
      }
      runCycle()
    </script>
  </body>
</html>
